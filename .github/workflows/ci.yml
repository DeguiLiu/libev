name: CI

on:
  push:
    branches: [master, feature/libuv-style-layout]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-default
            cc: gcc
            cmake_flags: ""
          - name: clang-default
            cc: clang
            cmake_flags: ""
          - name: gcc-asan
            cc: gcc
            cmake_flags: "-DCMAKE_BUILD_TYPE=Debug -DEV_SANITIZER=address"
          - name: gcc-tsan
            cc: gcc
            cmake_flags: "-DCMAKE_BUILD_TYPE=Debug -DEV_SANITIZER=thread"
          - name: gcc-usan
            cc: gcc
            cmake_flags: "-DCMAKE_BUILD_TYPE=Debug -DEV_SANITIZER=undefined"
          - name: clang-asan
            cc: clang
            cmake_flags: "-DCMAKE_BUILD_TYPE=Debug -DEV_SANITIZER=address"
          - name: gcc-release-o2
            cc: gcc
            cmake_flags: "-DCMAKE_BUILD_TYPE=Release"

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.cc }} ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure
